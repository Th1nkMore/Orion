[project]
name = "uq-orion"
version = "0.1.0"
description = "Uncertainty-aware safety extension for ORION autonomous driving framework"
requires-python = ">=3.11"
dependencies = [
    "numpy==1.26.4",
    "matplotlib==3.7.2",
    "pyyaml==6.0.1",
    "tqdm==4.66.1",
    "huggingface_hub==0.20.3",
    "scipy==1.13.1",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
