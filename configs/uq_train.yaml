model:
  d_patch: 1024        # EVAViT vision encoder (ORION backbone)
  n_views: 6           # 多视角摄像头数量
  n_patches: 1600      # 每个视角的 patch 数量 (40x40)
  n_query: 16          # 可学习 query 数量
  d_stat: 64           # 统计特征维度
  d_hidden: 512
  d_out: 256           # uncertainty embedding 维度

  # Ablation switches (set to false to disable component)
  use_stat_features: true     # whether to use 5-dim statistical features
  use_transformer_decoder: true  # whether to use cross-attention decoder (vs mean pool)

training:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 20
  warmup_epochs: 3
  seed: 42

loss:
  lambda_cal: 0.1       # calibration regularisation weight
  lambda_rank: 0.5      # ranking loss weight
  use_ranking: true      # ablation: disable ranking loss
  use_calibration: true  # ablation: disable calibration regularisation

data:
  feature_dir: ./data/features
  label_file: ./data/labels/uq_labels.pt
  val_ratio: 0.1
  stat_cache_file: ./data/stat_cache.pt
  preload: false
  preload_workers: 16
  n_patches_subsample: 256

logging:
  save_dir: ./checkpoints/uq
  log_interval: 10
  save_interval: 5
