model:
  d_patch: 1024        # EVAViT vision encoder (ORION backbone)
  n_views: 6           # 多视角摄像头数量
  n_patches: 1600      # 每个视角的 patch 数量 (40x40)
  n_query: 16          # 可学习 query 数量
  d_stat: 64           # 统计特征维度
  d_hidden: 512
  d_out: 256           # uncertainty embedding 维度

training:
  batch_size: 64
  lr: 3.0e-4
  weight_decay: 1.0e-4
  epochs: 50
  warmup_epochs: 5
  seed: 42

data:
  feature_dir: ./data/features
  label_file: ./data/labels/uq_labels.pt
  val_ratio: 0.1
  stat_cache_file: ./data/stat_cache.pt   # pre-computed stat_features; eliminates 1.5s/sample CPU cost
  preload: false                           # torch.load is fast on OS cache; full preloading adds complexity
  preload_workers: 16

logging:
  save_dir: ./checkpoints/uq
  log_interval: 10
  save_interval: 5
